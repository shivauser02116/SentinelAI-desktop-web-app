version: '3.9'

# Local development environment for SentinelAI backend
# Usage:
#   docker compose up -d          # Start PostgreSQL
#   docker compose logs -f db     # Watch DB logs
#   docker compose down -v        # Tear down (removes data)
#
# Requires Docker Desktop ≥ 4.x or Docker Engine ≥ 24.x with Compose V2.
# Not required for running the front-end offline demo.

services:
  db:
    image: postgres:16-alpine
    container_name: sentinelai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: sentinelai_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin web UI for inspecting the database
  # Uncomment to enable; access at http://localhost:5050
  # pgadmin:
  #   image: dpage/pgadmin4:8
  #   container_name: sentinelai_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db

volumes:
  pg_data:
